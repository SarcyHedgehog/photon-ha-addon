name: Photon HA Bridge
version: "0.2.3"
slug: photon_ha_bridge
description: Private Photon Realtime bridge for selected Home Assistant entities
url: https://github.com/SarcyHedgehog/photon-ha-addon
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8765
panel_icon: mdi:home-assistant
panel_title: Photon HA
options:
  photon_app_id: ""
  photon_region: eu
  room_name: photon-ha-home
  remote_password: ""
  study_password: ""
  study_entities:
    - light.office_light_switch_l1
    - light.office_light_switch_l2
    - light.office_standard_lamp
    - light.rgb_strip_lights
    - light.office_light_switch_l3
    - switch.heater
    - switch.screen
    - switch.office_standard
    - binary_sensor.studypresence_occupancy
    - binary_sensor.study_door_contact
    - binary_sensor.study_leak_detector_water_leak
    - sensor.study_door_device_temperature
    - sensor.heater_today_s_consumption
    - sensor.office_standard_today_s_consumption
    - sensor.back_garden_motion_illuminance
  debug: false
schema:
  photon_app_id: str
  photon_region: str
  room_name: str
  remote_password: password
  study_password: password
  study_entities: [str]
  debug: bool
